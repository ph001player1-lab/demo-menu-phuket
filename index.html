<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suan Fai — Thai Kitchen Menu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Marcellus&family=Noto+Sans+Thai:wght@300;400;500&display=swap');

  :root{
    --bg:#0B0F0D;
    --panel:#12160F;
    --gold:#B08D57;
    --gold-bright:#D9BE84;
    --ivory:#EDE6D6;
    --wine:#6B1E23;
    --hair: rgba(217,190,132,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, rgba(176,141,87,0.06), transparent 60%),
      var(--bg);
    color:var(--ivory);
    font-family:'Cormorant Garamond', serif;
    -webkit-font-smoothing:antialiased;
  }
  .th{font-family:'Noto Sans Thai','Cormorant Garamond',serif;}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 75%, transparent);
    padding:26px 20px 6px;
  }
  .brand{ text-align:center; max-width:720px; margin:0 auto; }
  .crest{ width:34px; height:34px; margin:0 auto 8px; opacity:.9; }
  .brand h1{
    font-family:'Marcellus', serif; font-weight:400;
    font-size:clamp(26px,6vw,36px); margin:0; letter-spacing:.04em;
    color:var(--gold-bright);
  }
  .brand .sub{
    font-size:11.5px; opacity:.6; letter-spacing:.22em; text-transform:uppercase;
    margin-top:6px;
  }
  .goldrule{
    width:64px; height:1px; margin:14px auto 0;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .langbar{ max-width:420px; margin:16px auto 0; display:flex; gap:6px; justify-content:center; }
  .langbar button{
    padding:6px 16px; border-radius:2px; border:1px solid var(--hair);
    background:transparent; color:var(--ivory); font-size:12px; cursor:pointer;
    font-family:'Cormorant Garamond', serif; letter-spacing:.08em; opacity:.5; transition:all .2s;
  }
  .langbar button.active{ border-color:var(--gold); color:var(--gold-bright); opacity:1; }
  nav.cats{
    max-width:720px; margin:16px auto 0; display:flex; gap:22px;
    overflow-x:auto; padding-bottom:10px; scrollbar-width:none; justify-content:center;
  }
  nav.cats::-webkit-scrollbar{display:none;}
  nav.cats a{
    white-space:nowrap; color:var(--ivory); text-decoration:none;
    font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;
    opacity:.55; padding-bottom:4px; border-bottom:1px solid transparent;
  }
  nav.cats a:hover{ opacity:1; border-color:var(--gold); }
  main{ max-width:720px; margin:0 auto; padding:10px 20px 70px; }
  .category-title{
    font-family:'Marcellus', serif; font-weight:400; font-size:24px;
    margin:48px 0 2px; color:var(--gold-bright); text-align:center; letter-spacing:.03em;
  }
  .category-note{ font-size:13px; opacity:.5; margin:2px 0 26px; text-align:center; font-style:italic; }
  .dish{
    display:grid; grid-template-columns:88px 1fr auto; gap:18px;
    align-items:start; padding:20px 0; border-bottom:1px solid var(--hair);
  }
  .dish .frame{
    width:88px; height:88px; border-radius:2px; padding:2px;
    border:1px solid var(--gold); background:var(--panel);
  }
  .dish img{ width:100%; height:100%; display:block; border-radius:1px; object-fit:cover; }
  .dish .name-row{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  .dish .name{ font-family:'Marcellus', serif; font-weight:400; font-size:18px; letter-spacing:.01em; }
  .dish .spice{ font-size:11px; color:var(--wine); letter-spacing:2px; border:1px solid var(--wine); padding:1px 5px; border-radius:2px; }
  .dish .desc{ font-size:14px; opacity:.62; margin-top:6px; line-height:1.55; font-style:italic; }
  .dish .price{
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:17px;
    color:var(--gold-bright); white-space:nowrap; align-self:center; letter-spacing:.02em;
  }
  .badge-veg{ color:#8a9a72; border:1px solid #8a9a72; border-radius:2px; padding:1px 6px; font-size:10.5px; letter-spacing:.06em; }
  footer{ text-align:center; padding:36px 20px 60px; font-size:12px; opacity:.4; font-style:italic; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="crest" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#B08D57" stroke-width="1"/>
      <path d="M20 8 L23 17 L32 17 L25 23 L28 32 L20 26 L12 32 L15 23 L8 17 L17 17 Z" fill="#B08D57" opacity="0.85"/>
    </svg>
    <h1 id="restName">Suan Fai</h1>
    <div class="sub" id="restSub">Thai Kitchen — Phuket</div>
    <div class="goldrule"></div>
  </div>
  <div class="langbar">
    <button data-lang="en" class="active">English</button>
    <button data-lang="ru">Русский</button>
    <button data-lang="th" class="th">ไทย</button>
  </div>
  <nav class="cats" id="catNav"></nav>
</header>

<main id="menuRoot"></main>

<footer id="footerNote">Prices in Thai Baht (THB). Please inform staff of any allergies.</footer>

<script>
const DATA = {

    ru:"Цены указаны в тайских батах (THB). Сообщите официанту об аллергии.",
    th:"ราคาเป็นเงินบาทไทย กรุณาแจ้งพนักงานหากมีอาการแพ้อาหาร"
  },
  categories: [
    {
      id:"starters",

      dishes:[
        { name:{en:"Spring Rolls", ru:"Спринг-роллы", th:"ปอเปี๊ยะทอด"},
          desc:{en:"Crispy rolls with glass noodles, cabbage & carrot, sweet chili dip",
                ru:"Хрустящие роллы с фунчозой, капустой и морковью, соус сладкий чили",
                th:"ปอเปี๊ยะทอดกรอบไส้วุ้นเส้น กะหล่ำปลี แครอท เสิร์ฟพร้อมซอสสวีทชิลี่"},
          price:220, spice:0, veg:true, photo:"spring-rolly.jpg" },

          price:320, spice:2, photo:"tom yam.jpg" },
        { name:{en:"Chicken Satay", ru:"Сатай из курицы", th:"สะเต๊ะไก่"},

          price:240, spice:3, veg:true, photo:"Green-Papaya-Salad-.jpg" }
      ]
    },
    {
      id:"curries",
      title:{en:"Curries", ru:"Карри", th:"แกง"},
      note:{en:"Served with steamed jasmine rice", ru:"Подаются с рисом жасмин", th:"เสิร์ฟพร้อมข้าวสวย"},
      dishes:[
        { name:{en:"Green Curry, Chicken", ru:"Зелёное карри с курицей", th:"แกงเขียวหวานไก่"},
          desc:{en:"Coconut milk, green chili paste, bamboo shoots, Thai basil",
                ru:"Кокосовое молоко, паста зелёного карри, побеги бамбука, тайский базилик",

          price:380, spice:2, photo:"Thai-Green-Curry-.jpg" },
        { name:{en:"Massaman Beef", ru:"Массаман с говядиной", th:"แกงมัสมั่นเนื้อ"},
          desc:{en:"Slow-braised beef short rib, potato, roasted peanuts, warm spice",
                ru:"Томлёная говядина, картофель, арахис, тёплые пряности",
                th:"เนื้อตุ๋นนุ่ม มันฝรั่ง ถั่วลิสง รสหวานมันกลมกล่อม"},

        { name:{en:"Yellow Curry, Vegetables", ru:"Жёлтое карри с овощами", th:"แกงกะหรี่ผัก"},
          desc:{en:"Turmeric coconut curry, seasonal vegetables, silken tofu",
                ru:"Кокосовое карри с куркумой, сезонные овощи, тофу",

          price:300, spice:1, veg:true, photo:"Yellow Curry, Vegetables.jpg" }
      ]
    },
    {
      id:"noodles",
      title:{en:"Noodles & Rice", ru:"Лапша и рис", th:"เส้นและข้าว"},
      note:{en:"Wok-fired classics", ru:"Классика вок", th:"เมนูผัดยอดนิยม"},
      dishes:[
        { name:{en:"Pad Thai, Prawn", ru:"Пад Тай с креветками", th:"ผัดไทยกุ้ง"},

                ru:"Рисовая лапша, креветки, яйцо, тофу, тамаринд, арахис",
                th:"เส้นจันทน์ กุ้งสด ไข่ เต้าหู้ ซอสมะขาม โรยถั่วลิสง"},
          price:340, spice:0, photo:"Pad Thai, Prawn.jpg" },
        { name:{en:"Pad Kra Pao, Pork", ru:"Пад Кра Пао со свининой", th:"ผัดกะเพราหมู"},
          desc:{en:"Stir-fried minced pork, holy basil, chili, fried egg on top",

                th:"หมูสับผัดกะเพราพริกสด เสิร์ฟพร้อมไข่ดาว"},
          price:280, spice:3, photo:"Pad Kra Pao, Pork.jpg" },
        { name:{en:"Khao Soi", ru:"Кхао Сой", th:"ข้าวซอย"},
          desc:{en:"Northern-style coconut curry noodles, crisp noodle crown",
                ru:"Северный кокосовый суп с лапшой, хрустящая лапша сверху",
                th:"ก๋วยเตี๋ยวแกงกะทิสไตล์เหนือ โรยเส้นกรอบด้านบน"},
          price:320, spice:1, photo:"Khao Soi.jpg" },
        { name:{en:"Seafood Fried Rice", ru:"Жареный рис с морепродуктами", th:"ข้าวผัดทะเล"},
          desc:{en:"Jasmine rice, prawns, squid, egg, spring onion",
                ru:"Рис жасмин, креветки, кальмар, яйцо, зелёный лук",
                th:"ข้าวหอมมะลิผัดกุ้ง ปลาหมึก ไข่ ต้นหอม"},
          price:360, spice:0, photo:"Seafood Fried Rice.jpg" }
      ]
    },
    {
      id:"sweets",
      title:{en:"Drinks & Sweets", ru:"Напитки и десерты", th:"เครื่องดื่มและของหวาน"},
      note:{en:"To close the evening", ru:"Для завершения вечера", th:"ปิดท้ายมื้ออาหาร"},
      dishes:[
        { name:{en:"Thai Iced Tea", ru:"Тайский чай со льдом", th:"ชาไทยเย็น"},
          desc:{en:"Strong black tea, condensed milk, crushed ice",
                ru:"Крепкий чёрный чай, сгущённое молоко, лёд",
                th:"ชาดำเข้มข้น นมข้นหวาน เสิร์ฟพร้อมน้ำแข็ง"},
          price:120, spice:0, photo:"Thai Iced Tea.jpg" },
        { name:{en:"Mango Sticky Rice", ru:"Манго со сладким рисом", th:"ข้าวเหนียวมะม่วง"},
          desc:{en:"Sweet coconut sticky rice, ripe mango, coconut cream",
                ru:"Клейкий рис на кокосовом молоке, спелое манго, кокосовые сливки",
                th:"ข้าวเหนียวมูนกะทิ มะม่วงสุก ราดกะทิสด"},
          price:220, spice:0, veg:true, photo:"Mango Sticky Rice.jpg" },
        { name:{en:"Chilled Young Coconut", ru:"Охлаждённый кокос", th:"มะพร้าวน้ำหอมสด"},
          desc:{en:"Served whole, spooned fresh at the table", ru:"Подаётся целиком, вскрывается за столом",
                th:"เสิร์ฟทั้งลูก ผ่าสดที่โต๊ะ"},
          price:150, spice:0, veg:true, photo:"Chilled Young Coconut.png" }
      ]
    }
  ]
};

let lang = "en";
function spiceStr(n){ return n ? "🌶".repeat(n) : ""; }

function render(){
  document.getElementById('restName').textContent = DATA.restName[lang];
  document.getElementById('restSub').textContent = DATA.restSub[lang];
  document.getElementById('footerNote').textContent = DATA.footer[lang];
  document.body.classList.toggle('th', lang==='th');

  const nav = document.getElementById('catNav');
  nav.innerHTML = DATA.categories.map(c=>`<a href="#${c.id}">${c.title[lang]}</a>`).join('');

  const root = document.getElementById('menuRoot');
  root.innerHTML = DATA.categories.map(c=>`
    <section id="${c.id}">
      <div class="category-title">${c.title[lang]}</div>
      <p class="category-note">${c.note[lang]}</p>
      ${c.dishes.map(d=>`
        <div class="dish">
          <div class="frame"><img src="photos/${d.photo}" alt="${d.name.en}" loading="lazy"></div>
          <div>
            <div class="name-row">
              <span class="name">${d.name[lang]}</span>
              ${d.spice ? `<span class="spice">${spiceStr(d.spice)}</span>` : ''}
              ${d.veg ? `<span class="badge-veg">VEG</span>` : ''}
            </div>
            <div class="desc">${d.desc[lang]}</div>
          </div>
          <div class="price">${d.price}฿</div>
        </div>
      `).join('')}
    </section>
  `).join('');
}

document.querySelectorAll('.langbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.langbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    lang = btn.dataset.lang;
    render();
  });
});

render();
</script>
</body>
</html>
